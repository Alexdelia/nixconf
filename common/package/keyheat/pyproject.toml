[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "keyheat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["evdev", "xkbcommon", "jeepney"]

[project.scripts]
keyheat = "keyheat.__main__:main"

[tool.setuptools]
packages = ["keyheat"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
